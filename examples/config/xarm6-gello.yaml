# Simulation only; serial numbers are metadata and physical cameras are not opened.
# Gripper: omit endpoints to calibrate startup=open with a -42 degree lever span.
# Prefer measured leader gripper_open_deg / gripper_closed_deg when available.
robot:
  id: xarm6_robotiq85
  fps: 30
  use_rerun: false
cameras:
  gripperCam:
    type: realsense
    model: d405
    serial_number: '352122272219'
    width: 640
    height: 480
    fps: 30
    use_depth: true
    depth_width: 640
    depth_height: 480
    align_depth: true
    simulation:
      attach_to: camera_link
      position:
      - 0
      - 0
      - 0
      look_at:
      - 0.2
      - 0
      - 0
      up:
      - 0
      - 0
      - 1
      near: 0.04
      far: 3.0
  isoCam:
    type: realsense
    model: d415
    serial_number: '027122062216'
    width: 640
    height: 480
    fps: 30
    use_depth: false
    depth_width: 640
    depth_height: 480
    align_depth: true
    simulation:
      attach_to: world
      position:
      - 1.1
      - -0.8
      - 0.8
      look_at:
      - 0.25
      - 0
      - 0.25
      up:
      - 0
      - 0
      - 1
      near: 0.04
      far: 3.0
  baseCam:
    type: realsense
    model: d435i
    serial_number: '926522071325'
    width: 640
    height: 480
    fps: 30
    use_depth: false
    depth_width: 640
    depth_height: 480
    align_depth: true
    simulation:
      attach_to: link_base
      position:
      - -0.2
      - 0
      - 0.3
      look_at:
      - 0.4
      - 0
      - 0.2
      up:
      - 0
      - 0
      - 1
      near: 0.04
      far: 3.0
teleoperation:
  mode: simulation
  simulation:
    control_source: leader
    physics_hz: 240
    viewer: true
    passive_force_compensation: true
    arm_stiffness: 1000.0
    arm_damping: 100.0
    force_limit: 100.0
    gripper_stiffness: 100.0
    gripper_damping: 10.0
    gripper_force_limit: 5.0
    max_joint_speed_deg_s: 60.0
    joint_offsets_deg: {}
  leader:
    type: gello
    port: /dev/ttyUSB0
    id: gello_xarm6
    use_degrees: true
    baudrate: 57600
    joint_ids:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    joint_signs:
    - 1
    - 1
    - -1
    - 1
    - 1
    - 1
    start_joints_rad:
    - 0
    - 0
    - -1.5708
    - 0
    - 1.5708
    - 0
    gripper_id: 8
    torque_joint_ids:
    - 3
arms:
  right:
    type: xarm6
    use_degrees: true
    cameras:
    - gripperCam
    - isoCam
    - baseCam
    end_effector_bounds:
      min:
      - -0.85
      - -0.85
      - 0.02
      max:
      - 0.85
      - 0.85
      - 1.2
    hard_workspace_guard: true
    workspace_guard_margin_m: 0.005
