<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleRobot Control</title>
    <script>
      window.telerobotClientMode = /OculusBrowser|Quest/i.test(navigator.userAgent)
        ? 'headset'
        : 'desktop';
    </script>
    <link rel="stylesheet" href="css/desktop-dashboard.css">
    
    <!-- A-Frame and dependencies -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Remove A-Frame's built-in grabbable component to avoid conflict with super-hands -->
    <script>delete AFRAME.components["grabbable"];</script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.misc.min.js"></script>
    <script src="https://unpkg.com/super-hands@3.0.5/dist/super-hands.min.js"></script>
    
    <!-- Application modules -->
    <script src="js/websocket-manager.js"></script>
    <script src="js/webrtc-manager.js"></script>
    <script src="js/desktop-dashboard.js" defer></script>
    <script src="js/components/laser-visibility.js"></script>
    <script src="js/components/look-at-headset.js"></script>
    <script src="js/components/video-panel.js?v=flicker-fix-v1"></script>
    <script src="js/components/controller-axes.js"></script>
    <script src="js/components/transform-status.js"></script>
    <script src="js/components/vr-button.js"></script>
    <script src="js/components/websocket-panel.js"></script>
    <script src="js/components/dataset-panel.js"></script>
    <script src="js/components/passthrough-manager.js"></script>
  </head>
  <body>
    <main id="desktop-dashboard" hidden>
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">RIF ROBOTICS</p>
          <h1>TeleRobot Control</h1>
        </div>
        <div class="header-badges">
          <span id="desktop-mode-badge" class="badge">MODE</span>
          <span id="desktop-connection-badge" class="badge badge-offline">Offline</span>
        </div>
      </header>

      <section class="dashboard-layout">
        <section class="camera-section" aria-labelledby="camera-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">LIVE VIEW</p>
              <h2 id="camera-heading">Cameras</h2>
            </div>
            <button id="desktop-refresh-cameras" class="button button-secondary" type="button">Refresh</button>
          </div>
          <div id="desktop-camera-grid" class="camera-grid">
            <p class="empty-message">Loading cameras…</p>
          </div>
        </section>

        <aside class="control-panel" aria-labelledby="recording-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">DATASET</p>
              <h2 id="recording-heading">Recording</h2>
            </div>
            <span id="desktop-recording-dot" class="recording-dot"></span>
          </div>

          <div class="status-card">
            <span>Status</span>
            <strong id="desktop-recording-status">Not recording</strong>
          </div>
          <div class="status-card">
            <span>Saved episodes</span>
            <strong id="desktop-episode-count">0</strong>
          </div>

          <button id="desktop-record-button" class="button button-primary button-wide" type="button" disabled>
            Start episode
          </button>
          <button id="desktop-reset-button" class="button button-secondary button-wide" type="button" disabled>
            Reset robot pose
          </button>
          <button id="desktop-finalize-button" class="button button-secondary button-wide" type="button" disabled>
            Finalize dataset
          </button>

          <p id="desktop-help" class="help-text">Connecting to the robot control server…</p>
          <button id="desktop-connect-button" class="text-button" type="button">Reconnect</button>
        </aside>
      </section>
    </main>

    <a-scene 
      passthrough-manager
      xr-mode-ui="XRMode: ar"
      renderer="colorManagement: true; toneMapping: no; exposure: 1"
      background="transparent: true">
      <a-assets></a-assets>

      <!-- RIF Robotics -->
      <a-text
        id="rif-banner"
        value="RIF ROBOTICS"
        position="0 2.25 -3"
        align="center"
        anchor="center"
        color="#FFFFFF"
        width="4"
        look-at-headset>
      </a-text>


      
      <!-- Environment -->
      <a-sky color="#222"></a-sky>
      <a-plane rotation="-90 0 0" width="20" height="20" color="#444"></a-plane>

      <!-- Container for dynamically created panels -->
      <a-entity id="panel-container" video-panel="mainCameraName: gripperCam"></a-entity>

      <!-- WebSocket connection panel -->
      <a-entity id="websocket-panel" websocket-panel></a-entity>

      <!-- Dataset recording panel -->
      <a-entity id="dataset-panel" dataset-panel></a-entity>

      <!-- Minimal A-button transform reset status -->
      <a-entity id="transform-status" transform-status></a-entity>

      <!-- Left hand controller with laser ray -->
      <a-entity 
        id="left-hand"
        super-hands="colliderEvent: raycaster-intersection; colliderEventProperty: els; colliderEndEvent: raycaster-intersection-cleared; colliderEndEventProperty: clearedEls"
        meta-touch-controls="hand: left; controllerType: quest3"
        laser-controls="hand: left"
        raycaster="objects: .draggable, .clickable; far: 5; lineColor: #ff6b6b; lineOpacity: 0.8"
        line="color: #ff6b6b; opacity: 0; visible: false"
        laser-visibility
        controller-axes="showPosition: true">
      </a-entity>

      <!-- Right hand controller with laser ray -->
      <a-entity 
        id="right-hand"
        super-hands="colliderEvent: raycaster-intersection; colliderEventProperty: els; colliderEndEvent: raycaster-intersection-cleared; colliderEndEventProperty: clearedEls"
        meta-touch-controls="hand: right; controllerType: quest3"
        laser-controls="hand: right"
        raycaster="objects: .draggable, .clickable; far: 5; lineColor: #6bcf7f; lineOpacity: 0.8"
        line="color: #6bcf7f; opacity: 0; visible: false"
        laser-visibility
        controller-axes="showPosition: true">
      </a-entity>
    </a-scene>
  </body>
</html>
