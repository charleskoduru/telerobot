# Telerobot Configuration
# Copy this file to config.yaml and adjust to match your setup.

robot:
  id: single_arm
  fps: 30
  use_rerun: false  # set to true to enable the Rerun viewer

cameras:
  gripperCam:
    type: realsense
    model: d405
    serial_number: "352122272219"
    width: 640
    height: 480
    fps: 30
    use_depth: true
    depth_width: 640
    depth_height: 480
    align_depth: true
    vr_gamma: 1.0      # Lower values brighten shadows.
    vr_gain: 1.0     # Multiplies the full image brightness.
    vr_brightness: 20    # Adds brightness after gain (0-100).
    simulation:
      attach_to: gripper_link
      # Local coordinates in gripper_link. SAPIEN cameras look along +X.
      # These are easy-to-tune placeholders until we measure your real D405 mount.
      position: [0.025, 0.0, -0.025]
      look_at: [0.025, 0.0, -0.18]
      up: [1.0, 0.0, 0.0]
      near: 0.04
      far: 2.0


  isoCam:
    type: realsense
    model: d415
    serial_number: "027122062216"
    width: 640
    height: 480
    fps: 30
    use_depth: false
    depth_width: 640
    depth_height: 480
    align_depth: true
    vr_gamma: 1.0
    vr_gain: 1.0
    vr_brightness: 15
    simulation:
      attach_to: world
      position: [0.525,0.02,0.35]
      look_at: [0.20, 0.0, 0.05]
      up: [0.0, 0.0, 1.0]
      near: 0.03
      far: 3.0

  baseCam:
    type: realsense
    model: d435i
    serial_number: "926522071325"
    width: 640
    height: 480
    fps: 30
    use_depth: false
    depth_width: 640
    depth_height: 480
    align_depth: true
    vr_gamma: 1.0
    vr_gain: 1.0
    vr_brightness: 0
    simulation:
      attach_to: shoulder_link
      position: [0.00, 0.00, 0.04 ]
      look_at: [0.20, 0.0, -0.05]
      up: [0.0, 0.0, 1.0]
      near: 0.03
      far: 3.0

teleoperation:
  # vr | leader | simulation
  mode: simulation

  # Used only when mode: simulation. The same SAPIEN robot can be driven by
  # either your SO-101 leader arm or the existing Quest/VR IK pipeline.
  simulation:
    control_source: leader  # leader | vr
    physics_hz: 240
    viewer: true
    passive_force_compensation: true

  leader:
    type: so101_leader
    port: /dev/ttyACM1
    id: so101_leader
    use_degrees: true


arms:
  right:  # change to "left" if using your left VR controller
    type: so100
    port: /dev/ttyACM0
    use_degrees: true
    cameras: [gripperCam, isoCam, baseCam]
    regularization: 1.0e-3 #adjust IK smoothing/stability (lower = more aggressive, higher = more stable), .5e-3, 1.0e-3, 3.0e-3 MAX: 
    end_effector_step_sizes: {  x: 0.45, y: 0.45, z: 0.45 } #scale between xr controller pose vs. robot end effector pose (lower = less sensitive, higher = more sensitive) 
    end_effector_bounds: #allowable workspace for the robot end effector (in meters), measure from the robot base j1. 
      min: [0.0417, -0.2545, -0.0585]
      max: [0.413, 0.2829, 0.3498]

      # min: [0.05, -0.20, -0.025]
      # max: [0.40,  0.20, 0.30]



  
    max_ee_step_m: 0.04 # from 0.2, limit how much the end effectors moves per frame (in meters) to avoid overshooting and instability
    hard_workspace_guard: true # final FK safety check; applies to both VR and leader-arm commands
    workspace_guard_margin_m: 0.005 # keep the predicted EE 5 mm inside the configured box
    gripper_speed_factor: 20.0 # gripper speed

#Uncomment to enable episode recording to a LeRobot dataset
dataset:
    repo_id: "charlieK123/depth_dataSet1"
    single_task: "picking up forceps and sorting the forceps"
    push_to_hub: true  # set to true to push the dataset to Hugging Face Hub on save
    #root: "./datasets"  # optional: override dataset storage path
