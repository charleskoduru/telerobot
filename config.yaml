# Change only this selector to switch the complete robot/leader/camera profile.
# xarm6 = GELLO + xArm6/Robotiq 2F-85; so101 = original SO101 simulation.
# Change only profile to switch the entire robot/leader/camera configuration.
# Available: xarm6, so101. GELLO startup assumes its gripper is OPEN.
profile: xarm6 #so101 | xarm6
profiles:
  xarm6:
    robot:
      id: xarm6_robotiq85
      fps: 30
      use_rerun: false
    cameras:
      gripperCam:
        type: realsense
        model: d405
        serial_number: '352122272219'
        width: 640
        height: 480
        fps: 30
        use_depth: true
        depth_width: 640
        depth_height: 480
        align_depth: true
        simulation:
          attach_to: camera_link
          position:
          - 0
          - 0
          - 0
          look_at:
          - 0.2
          - 0
          - 0
          up:
          - 0
          - 0
          - 1
          near: 0.04
          far: 3.0
      isoCam:
        type: realsense
        model: d415
        serial_number: '027122062216'
        width: 640
        height: 480
        fps: 30
        use_depth: false
        depth_width: 640
        depth_height: 480
        align_depth: true
        simulation:
          attach_to: world
          position:
          - 1.1
          - -0.8
          - 0.8
          look_at:
          - 0.25
          - 0
          - 0.25
          up:
          - 0
          - 0
          - 1
          near: 0.04
          far: 3.0
      baseCam:
        type: realsense
        model: d435i
        serial_number: '926522071325'
        width: 640
        height: 480
        fps: 30
        use_depth: false
        depth_width: 640
        depth_height: 480
        align_depth: true
        simulation:
          attach_to: link_base
          position:
          - -0.2
          - 0
          - 0.3
          look_at:
          - 0.4
          - 0
          - 0.2
          up:
          - 0
          - 0
          - 1
          near: 0.04
          far: 3.0
    teleoperation:
      mode: simulation
      simulation:
        control_source: leader
        physics_hz: 240
        viewer: true
        passive_force_compensation: true
        arm_stiffness: 1000.0
        arm_damping: 100.0
        force_limit: 100.0
        gripper_stiffness: 100.0
        gripper_damping: 10.0
        gripper_force_limit: 5.0
        max_joint_speed_deg_s: 120.0
        joint_offsets_deg: {}
      leader:
        type: gello
        port: /dev/ttyUSB0
        id: gello_xarm6
        use_degrees: true
        baudrate: 57600
        joint_ids:
        - 1
        - 2
        - 4
        - 5
        - 6
        - 7
        joint_signs:
        - 1
        - 1
        - -1
        - 1
        - 1
        - 1
        start_joints_rad:
        - 0
        - 0
        - -1.5708
        - 0
        - 1.5708
        - 0
        gripper_id: 8
        torque_joint_ids:
        - 3
    arms:
      right:
        type: xarm6
        use_degrees: true
        cameras:
        - gripperCam
        - isoCam
        - baseCam
        end_effector_bounds:
          min:
          - -0.85
          - -0.85
          - 0.02
          max:
          - 0.85
          - 0.85
          - 1.2
        hard_workspace_guard: true
        workspace_guard_margin_m: 0.005
  so101:
    robot:
      id: single_arm
      fps: 30
      use_rerun: false
    cameras:
      gripperCam:
        type: realsense
        model: d405
        serial_number: '352122272219'
        width: 640
        height: 480
        fps: 30
        use_depth: true
        depth_width: 640
        depth_height: 480
        align_depth: true
        vr_gamma: 1.0
        vr_gain: 1.0
        vr_brightness: 20
        simulation:
          attach_to: gripper_link
          position:
          - 0.0
          - 0.07
          - 0.0
          look_at:
          - 0.025
          - 0.0
          - -0.18
          up:
          - 0.0
          - 1.0
          - 0.0
          near: 0.04
          far: 2.0
      isoCam:
        type: realsense
        model: d415
        serial_number: '027122062216'
        width: 640
        height: 480
        fps: 30
        use_depth: false
        depth_width: 640
        depth_height: 480
        align_depth: true
        vr_gamma: 1.0
        vr_gain: 1.0
        vr_brightness: 15
        simulation:
          attach_to: world
          position:
          - 0.525
          - 0.02
          - 0.35
          look_at:
          - 0.2
          - 0.0
          - 0.05
          up:
          - 0.0
          - 0.0
          - 1.0
          near: 0.03
          far: 3.0
      baseCam:
        type: realsense
        model: d435i
        serial_number: '926522071325'
        width: 640
        height: 480
        fps: 30
        use_depth: false
        depth_width: 640
        depth_height: 480
        align_depth: true
        vr_gamma: 1.0
        vr_gain: 1.0
        vr_brightness: 0
        simulation:
          attach_to: shoulder_link
          position:
          - -0.04
          - 0.0
          - 0.03
          look_at:
          - -1.0
          - 0.0
          - 0.0
          up:
          - 0.0
          - 0.0
          - 1.0
          near: 0.03
          far: 3.0
    teleoperation:
      mode: simulation
      simulation:
        control_source: leader
        physics_hz: 240
        viewer: true
        passive_force_compensation: true
        joint_offsets_deg:
          wrist_roll: -90.0
      leader:
        type: so101_leader
        port: /dev/ttyACM1
        id: so101_leader
        use_degrees: true
    arms:
      right:
        type: so100
        port: /dev/ttyACM0
        use_degrees: true
        cameras:
        - gripperCam
        - isoCam
        - baseCam
        regularization: 0.001
        end_effector_step_sizes:
          x: 0.45
          y: 0.45
          z: 0.45
        end_effector_bounds:
          min:
          - 0.0417
          - -0.2545
          - -0.0585
          max:
          - 0.413
          - 0.2829
          - 0.3498
        max_ee_step_m: 0.04
        hard_workspace_guard: true
        workspace_guard_margin_m: 0.005
        gripper_speed_factor: 20.0
    dataset:
      repo_id: charlieK123/simDataTest
      single_task: picking up forceps and sorting the forceps
      push_to_hub: true
